name: Playwright Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Configure Staging Database for CI
        env:
          SECRET_STAGING_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$SECRET_STAGING_URL" ]; then
            STAGING_URL="$SECRET_STAGING_URL"
          elif [ -n "$SECRET_DATABASE_URL" ]; then
            STAGING_URL=$(node -e '
              const u = new URL(process.env.SECRET_DATABASE_URL);
              if (u.pathname === "/vdslab_jp") {
                u.pathname = "/vdslab_jp_staging";
              }
              console.log(u.toString());
            ')
          else
            echo "::error::Neither DATABASE_URL_STAGING nor DATABASE_URL secret is set! Fork PRs do not have access to repository secrets."
            exit 1
          fi
          echo "::add-mask::$STAGING_URL"
          echo "DATABASE_URL=$STAGING_URL" >> $GITHUB_ENV

      - name: Run Playwright tests
        run: npm test
        env:
          CI: "true"
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
